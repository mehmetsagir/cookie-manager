<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app-shell">
  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo-wrapper">
        <svg class="header-logo-icon" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="11" fill="var(--color-brand)" opacity="0.15"/>
          <circle cx="12" cy="12" r="8" fill="var(--color-brand)" opacity="0.3"/>
          <circle cx="12" cy="12" r="5" fill="var(--color-brand)"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="header-title">Cookie Manager</h1>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeToggleBtn" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="refreshBtn" class="icon-btn" title="Refresh cookies" aria-label="Refresh cookies">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== CURRENT TAB INFO ===== -->
  <div class="current-tab-bar">
    <div class="current-tab-info">
      <div class="domain-icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <span id="currentDomain" class="current-domain-text">Loading...</span>
    </div>
    <span id="cookieCount" class="cookie-count-badge">0</span>
  </div>

  <!-- ===== SEARCH & FILTERS ===== -->
  <div class="filters-bar">
    <div class="search-wrapper">
      <svg class="icon icon-sm search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search cookies..."
        autocomplete="off"
        spellcheck="false"
      />
      <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear search" hidden>
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <select id="domainFilter" class="domain-filter" title="Filter by domain" aria-label="Filter by domain">
      <option value="">All domains</option>
    </select>
  </div>

  <!-- ===== TOOLBAR ===== -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="selectAllBtn" class="toolbar-btn" title="Select all">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span class="toolbar-btn-label">Select All</span>
      </button>
    </div>
    <div class="toolbar-right">
      <button id="copyAllBtn" class="toolbar-btn" title="Copy all as JSON">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <button id="exportBtn" class="toolbar-btn" title="Export cookies">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <div class="toolbar-divider"></div>
      <button id="deleteSelectedBtn" class="toolbar-btn toolbar-btn-danger" title="Delete selected" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>
      <button id="clearAllBtn" class="toolbar-btn toolbar-btn-danger" title="Clear all cookies">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ===== EXPORT FORMAT SELECTOR ===== -->
  <div id="exportPanel" class="export-panel" hidden>
    <div class="export-panel-inner">
      <span class="export-panel-label">Format:</span>
      <div class="export-format-group">
        <button class="export-format-btn" data-format="json">JSON</button>
        <button class="export-format-btn" data-format="netscape">Netscape</button>
        <button class="export-format-btn" data-format="header">Header</button>
        <button class="export-format-btn" data-format="pairs">Pairs</button>
      </div>
    </div>
  </div>

  <!-- ===== COOKIE LIST ===== -->
  <main class="cookie-list-wrapper">
      <div id="cookieList" class="cookie-list" role="list" aria-label="Cookie list">
        <!-- Populated by popup.js -->
      </div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon-wrapper">
          <svg class="empty-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="32" cy="32" r="28"/>
            <circle cx="22" cy="26" r="3" fill="currentColor"/>
            <circle cx="42" cy="26" r="3" fill="currentColor"/>
            <circle cx="32" cy="38" r="3" fill="currentColor"/>
            <circle cx="22" cy="44" r="2" fill="currentColor"/>
            <circle cx="44" cy="42" r="2" fill="currentColor"/>
          </svg>
        </div>
        <p class="empty-title">No cookies found</p>
        <p class="empty-subtitle" id="emptySubtitle">This page has no cookies for the current domain.</p>
      </div>
      <div id="loadingState" class="loading-state">
        <div class="spinner" aria-label="Loading"></div>
        <p>Loading cookies...</p>
      </div>
  </main>

  <!-- ===== TRANSFER SECTION ===== -->
  <section class="transfer-section" id="transferSection">
    <button class="transfer-toggle" id="transferToggle" aria-expanded="false" aria-controls="transferBody">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
      Transfer Cookies
      <svg class="icon icon-sm transfer-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="transfer-body" id="transferBody" hidden>
      <div class="transfer-grid">
        <div class="transfer-field">
          <label class="transfer-label" for="sourceTab">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            Source
          </label>
          <select id="sourceTab" class="transfer-select" aria-label="Source tab">
            <option value="">Select source tab...</option>
          </select>
        </div>

        <div class="transfer-arrow-col" aria-hidden="true">
          <svg class="transfer-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>

        <div class="transfer-field">
          <label class="transfer-label" for="targetTab">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            Target
          </label>
          <select id="targetTab" class="transfer-select" aria-label="Target tab">
            <option value="">Select target tab...</option>
          </select>
        </div>
      </div>

      <div class="transfer-options">
        <label class="checkbox-label">
          <input type="checkbox" id="transferOverwrite" checked />
          <span class="checkbox-custom"></span>
          Overwrite existing cookies
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="transferMoveMode" />
          <span class="checkbox-custom"></span>
          Move (delete from source)
        </label>
      </div>

      <button id="transferBtn" class="btn btn-primary btn-full">
        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        Transfer Cookies
      </button>
    </div>
  </section>

  <!-- ===== STATUS BAR ===== -->
  <div id="statusBar" class="status-bar" role="status" aria-live="polite" hidden></div>
</div><!-- .app-shell -->

  <script src="utils/exportFormats.js"></script>
  <script src="popup.js"></script>
</body>
</html>
